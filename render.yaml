# File: render.yaml — Render deployment config for reelvo.ai

services:
  - type: web
    name: reelvo-ai
    env: python

    # ───────────────────────────────────────────────
    # 🔧 Build setup
    # ───────────────────────────────────────────────
    buildCommand: |
      ./install.sh
      pip install --upgrade pip
      pip install -r requirements.txt

    # ───────────────────────────────────────────────
    # 🚀 Start command (Gunicorn + Flask)
    # ───────────────────────────────────────────────
    startCommand: gunicorn main:flask_app --bind 0.0.0.0:$PORT

    # ───────────────────────────────────────────────
    # ⚙️ Deploy settings
    # ───────────────────────────────────────────────
    autoDeploy: true
    plan: free  # Consider 'starter' or higher for background tasks & better perf

    # ───────────────────────────────────────────────
    # 🔐 Environment variables
    # (Values are configured via Render Dashboard)
    # Avoid hardcoding secrets here
    # ───────────────────────────────────────────────
    envVars:
      - key: FLASK_ENV
        value: production

      # Feature toggles
      - key: USE_OPENAI
        value: false
      - key: USE_GOOGLE_CLOUD_TTS
        value: false

      # API keys (should be set in Render UI or synced)
      - key: OPENAI_API_KEY
        sync: false

      # TTS Configuration
      - key: GOOGLE_CLOUD_TTS_VOICE
        value: en-US-Wavenet-D

      # For Google Cloud credentials (optional methods)
      # Recommended: Render Secret Files or base64 decode in runtime
      # - key: GOOGLE_APPLICATION_CREDENTIALS
      #   value: /etc/secrets/credentials.json

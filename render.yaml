# File: render.yaml — Render deployment config for Reelvo

services:
  - type: web
    name: reelvo
    env: python

    # ───────────────────────────────────────────────
    # 🔧 Build Setup
    # ───────────────────────────────────────────────
    buildCommand: |
      ./install.sh
      pip install --upgrade pip
      pip install -r requirements.txt

    # ───────────────────────────────────────────────
    # 🚀 Start Command (Gunicorn for Production)
    # ───────────────────────────────────────────────
    startCommand: gunicorn main:flask_app --bind 0.0.0.0:$PORT

    # ───────────────────────────────────────────────
    # ⚙️ Deployment Settings
    # ───────────────────────────────────────────────
    autoDeploy: true
    plan: starter  # Use 'starter' or higher for background tasks and better reliability

    # ───────────────────────────────────────────────
    # 🔐 Environment Variables
    # Configure these in Render Dashboard
    # Secrets should NOT be hardcoded
    # ───────────────────────────────────────────────
    envVars:
      # Environment Mode
      - key: FLASK_ENV
        value: production

      # Feature Toggles
      - key: USE_OPENAI
        value: false
      - key: USE_GOOGLE_CLOUD_TTS
        value: false

      # API Keys (set securely via Render Dashboard)
      - key: OPENAI_API_KEY
        sync: false

      # TTS Voice Configuration
      - key: GOOGLE_CLOUD_TTS_VOICE
        value: en-US-Wavenet-D

      # Optional: Google Cloud credentials file path
      # - key: GOOGLE_APPLICATION_CREDENTIALS
      #   value: /etc/secrets/credentials.json

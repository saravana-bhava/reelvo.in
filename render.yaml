# File: render.yaml — Render deployment config for reelvo.ai

services:
  - type: web
    name: reelvo-ai
    env: python

    # ───────────────────────────────────────────────
    # 🔧 Build setup
    # ───────────────────────────────────────────────
    buildCommand: |
      ./install.sh
      pip install --upgrade pip
      pip install -r requirements.txt

    # ───────────────────────────────────────────────
    # 🚀 Start command (Gunicorn + Flask)
    # ───────────────────────────────────────────────
    startCommand: gunicorn main:flask_app --bind 0.0.0.0:$PORT

    # ───────────────────────────────────────────────
    # ⚙️ Deploy settings
    # ───────────────────────────────────────────────
    autoDeploy: true
    plan: free  # Consider 'starter' or higher for faster performance & background jobs

    # ───────────────────────────────────────────────
    # 🔐 Environment variables (set values in dashboard)
    # Avoid putting secrets directly in this file!
    # ───────────────────────────────────────────────
    envVars:
      - key: FLASK_ENV
        value: production

      # Feature toggles
      - key: USE_OPENAI
        value: false
      - key: USE_GOOGLE_CLOUD_TTS
        value: false

      # API keys (do NOT hardcode)
      - key: OPENAI_API_KEY
        sync: false

      # TTS configuration
      - key: GOOGLE_CLOUD_TTS_VOICE
        value: en-US-Wavenet-D

      # You may also configure GOOGLE_APPLICATION_CREDENTIALS via:
      # - Render's Secret Files (recommended)
      # - base64 env var and decode in runtime
      # Example (if needed):
      # - key: GOOGLE_APPLICATION_CREDENTIALS
      #   value: /etc/secrets/credentials.json
'['
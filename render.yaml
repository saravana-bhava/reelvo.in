# File: render.yaml — Render deployment config for reelvo.ai

services:
  - type: web
    name: reelvo-ai
    env: python

    # ───────────────────────────────────────────────
    # 🔧 Build setup
    # ───────────────────────────────────────────────
    buildCommand: |
      ./install.sh
      pip install --upgrade pip
      pip install -r requirements.txt

    # ───────────────────────────────────────────────
    # 🚀 Start command (Gunicorn + Flask)
    # ───────────────────────────────────────────────
    startCommand: gunicorn main:flask_app --bind 0.0.0.0:$PORT

    # ───────────────────────────────────────────────
    # ⚙️ Deploy settings
    # ───────────────────────────────────────────────
    autoDeploy: true
    plan: free  # ⬆️ Upgrade to 'standard' or 'pro' for high concurrency & performance

    # ───────────────────────────────────────────────
    # 🔐 Environment variables (set values in dashboard)
    # Avoid putting secrets directly in this file!
    # ───────────────────────────────────────────────
    envVars:
      - key: FLASK_ENV
        value: production

      # Feature toggles
      - key: USE_OPENAI
        value: false
      - key: USE_GOOGLE_CLOUD_TTS
        value: false

      # API keys (set in dashboard UI for security)
      - key: OPENAI_API_KEY
        sync: false

      # TTS configuration
      - key: GOOGLE_CLOUD_TTS_VOICE
        value: en-US-Wavenet-D

      # Optional: Provide the credential content using Render's secret file feature
      # Or inject base64 via another environment var
      # - key: GOOGLE_APPLICATION_CREDENTIALS
      #   value: /etc/credentials/google.json

# File: render.yaml — Render deployment config for reelvo.ai

services:
  - type: web
    name: reelvo-ai
    env: python

    # ───────────────────────────────────────────────
    # 🔧 Build setup
    # ───────────────────────────────────────────────
    buildCommand: |
      ./install.sh
      pip install --upgrade pip
      pip install -r requirements.txt

    # ───────────────────────────────────────────────
    # 🚀 Start command (Gunicorn + Flask)
    # ───────────────────────────────────────────────
    startCommand: gunicorn main:flask_app --bind 0.0.0.0:$PORT

    # ───────────────────────────────────────────────
    # ⚙️ Deploy settings
    # ───────────────────────────────────────────────
    autoDeploy: true
    plan: free  # Upgrade to 'standard' or 'pro' for production use

    # ───────────────────────────────────────────────
    # 🔐 Environment variables (define securely via dashboard)
    # ───────────────────────────────────────────────
    envVars:
      - key: FLASK_ENV
        value: production

      # Feature toggles
      - key: USE_OPENAI
        value: false
      - key: USE_ELEVENLABS
        value: true
      - key: USE_GOOGLE_CLOUD_TTS
        value: false

      # API keys (keep secrets in dashboard, not in repo)
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

      # TTS configuration
      - key: ELEVENLABS_VOICE_ID
        value: 9BWtsMINqrJLrRacOk9x
      - key: GOOGLE_CLOUD_TTS_VOICE
        value: en-US-Wavenet-D

      # Google Cloud credentials path (adjust for runtime env)
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /var/www/html/SazM/reelvo.ai/secure/credentials.json

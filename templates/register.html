{% extends "base.html" %}
{% block title %}Register - Reelvo{% endblock %}

{% block content %}
<h2 class="page-heading">📝 Register on Reelvo</h2>

<form method="post"
      action="{{ url_for('auth.register') }}"
      class="form-card"
      aria-label="Registration Form">

  <!-- Email Field -->
  <label for="email" class="form-label">
    📧 Email Address
  </label>
  <input type="email"
         id="email"
         name="email"
         placeholder="Enter your email..."
         required
         autocomplete="email"
         class="form-input"
         aria-describedby="emailHelp" />
  <div id="emailHelp" class="form-help">This will be your login email.</div>

  <!-- Password Field -->
  <label for="password" class="form-label">
    🔒 Choose Password
  </label>
  <input type="password"
         id="password"
         name="password"
         placeholder="Create a strong password..."
         required
         autocomplete="new-password"
         class="form-input"
         aria-describedby="passwordHelp" />
  <div id="passwordHelp" class="form-help">Must be at least 6 characters.</div>

  <!-- Referral (Optional Hidden) -->
  {% if referral_code %}
    <input type="hidden" name="ref" value="{{ referral_code }}">
  {% endif %}

  <!-- Submit Button -->
  <button type="submit" class="button button-success" style="width: 100%;">
    ✅ Register
  </button>

  <!-- Footer Link -->
  <div class="form-footer">
    Already have an account?
    <a href="{{ url_for('auth.login') }}" class="link-primary">
      Login here
    </a>
  </div>
</form>

{% endblock %}

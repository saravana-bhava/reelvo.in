{% extends "base.html" %}
{% block title %}Register - Reelvo.ai{% endblock %}

{% block content %}
  <h2 class="page-heading">📝 Register on Reelvo.ai</h2>

  <form method="post"
        action="{{ url_for('auth.register') }}"
        class="form-card"
        aria-label="Registration Form">

    <label for="email" class="form-label">
      📧 Email Address
    </label>
    <input type="email"
           id="email"
           name="email"
           placeholder="Enter your email..."
           required
           autocomplete="email"
           class="form-input" />

    <label for="password" class="form-label">
      🔒 Choose Password
    </label>
    <input type="password"
           id="password"
           name="password"
           placeholder="Create a password..."
           required
           autocomplete="new-password"
           class="form-input" />

    <button type="submit" class="button button-success" style="width: 100%;">
      ✅ Register
    </button>

    <div class="form-footer">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="link-primary">
        Login here
      </a>
    </div>
  </form>
{% endblock %}

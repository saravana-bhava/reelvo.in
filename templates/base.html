<!-- File: templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block title %}Reelvo.ai{% endblock %}</title>

  <!-- SEO & Favicon -->
  <meta name="description" content="Generate Instagram Reels with AI - Reelvo.ai" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #333;
    }

    header {
      background: #1e88e5;
      color: #fff;
      padding: 16px;
      text-align: center;
    }

    nav {
      background: #1565c0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 12px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      text-decoration: underline;
      opacity: 0.9;
    }

    .logout-form {
      display: inline;
    }

    .logout-form button {
      background: transparent;
      color: #fff;
      border: 1px solid #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .logout-form button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .container {
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    textarea,
    input[type="text"],
    input[type="file"],
    select,
    input[type="date"] {
      width: 100%;
      margin: 10px 0 20px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      background: #1e88e5;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1565c0;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      background: #1e88e5;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .button:hover {
      background: #1565c0;
    }

    .flash {
      background: #e3f2fd;
      color: #0d47a1;
      padding: 12px 16px;
      border-left: 4px solid #0d47a1;
      margin-bottom: 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎞️ Reelvo.ai</h1>
  </header>

  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('create_reel') }}">Create Reel</a>
    <a href="{{ url_for('list_reels') }}">Reel History</a>
    <a href="{{ url_for('view_schedule') }}">Scheduled Reels</a>
    {% if session.user %}
      <form action="{{ url_for('disconnect_instagram') }}" method="post" class="logout-form">
        <button type="submit">Disconnect Instagram</button>
      </form>
      <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a>
    {% endif %}
  </nav>

  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="flash">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>

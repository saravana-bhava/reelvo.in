<!-- File: templates/reel_progress.html -->

{% extends "base.html" %}
{% block title %}Creating Reel...{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 text-center">
  <h2 class="text-2xl font-semibold mb-4">🎬 Creating your reel...</h2>

  <div class="w-full bg-gray-300 rounded-full h-6 overflow-hidden mb-4">
    <div id="progress-bar" class="bg-blue-600 h-full text-white text-xs text-center transition-all duration-500 ease-in-out" style="width: 0%">
      0%
    </div>
  </div>

  <p id="progress-message" class="text-gray-700 mb-4">Initializing...</p>
  <div id="final-link" class="mt-4 text-green-700 font-bold"></div>
</div>

<script>
const taskId = "{{ task_id }}";
const bar = document.getElementById("progress-bar");
const msg = document.getElementById("progress-message");
const link = document.getElementById("final-link");

async function pollProgress() {
  try {
    const res = await fetch(`/progress/${taskId}`);
    const data = await res.json();

    const percent = data.percent || 0;
    bar.style.width = percent + "%";
    bar.textContent = percent + "%";

    if (data.message) {
      msg.innerHTML = data.message;
    } else if (data.status) {
      msg.innerHTML = data.status;
    } else {
      msg.innerHTML = "Working...";
    }

    if (data.elapsed !== undefined) {
      msg.innerHTML += `<br><small>⏱ Elapsed: ${data.elapsed}s</small>`;
    }

        if (percent < 100) {
          setTimeout(pollProgress, 1500);
        } else {
          link.innerHTML = `${data.message}<br><a href="${data.download_url}" class="underline">Download Link</a>`;
        }
  } catch (err) {
    console.error("Error polling progress:", err);
    msg.textContent = "⚠️ Lost connection to progress tracker.";
  }
}

pollProgress();
</script>
{% endblock %}

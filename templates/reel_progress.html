<!-- File: templates/reel_progress.html -->

{% extends "base.html" %}
{% block title %}Creating Reel...{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-16 px-6 text-center">
  <h2 class="text-3xl font-bold text-gray-800 dark:text-gray-600 mb-6 animate__animated animate__fadeInDown flex items-center justify-center gap-2">
    🎬 Creating Your Reel
    <svg id="spinner" class="animate-spin h-6 w-6 text-blue-600 dark:text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
    </svg>
  </h2>

  <!-- Progress Bar Container -->
  <div class="relative w-full h-6 rounded-full bg-gray-300 dark:bg-gray-700 overflow-hidden shadow-inner">
    <div id="progress-bar"
         class="absolute left-0 top-0 h-full bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700 text-white text-sm font-medium flex items-center justify-center transition-all duration-500 ease-in-out rounded-full"
         style="width: 0%">
      0%
    </div>
  </div>

  <!-- Progress Message -->
  <p id="progress-message" class="text-gray-600 dark:text-gray-300 text-sm mt-4">
    Initializing...
  </p>

  <!-- Final Output -->
  <div id="final-link"
       class="mt-6 text-green-700 dark:text-green-400 font-semibold text-md leading-relaxed">
  </div>
</div>

<!-- Polling Script -->
<script>
  const taskId = "{{ task_id }}";
  const bar = document.getElementById("progress-bar");
  const msg = document.getElementById("progress-message");
  const link = document.getElementById("final-link");
  const spinner = document.getElementById("spinner");

  async function pollProgress() {
    try {
      const res = await fetch(`/progress/${taskId}`);
      const data = await res.json();

      const percent = data.percent || 0;
      bar.style.width = percent + "%";
      bar.textContent = percent + "%";

      const progressMessage = data.message?.trim() || data.status?.trim() || "Working...";
      msg.innerHTML = progressMessage;

      if (data.elapsed !== undefined) {
        msg.innerHTML += `<br><small class="text-gray-400">⏱ Elapsed: ${data.elapsed}s</small>`;
      }

      if (percent < 100) {
        setTimeout(pollProgress, 1500);
      } else {
        spinner.style.display = "none"; // Hide spinner on completion
        link.innerHTML = `
          ✅ <span class="block mb-1">${data.message || 'Reel generation complete!'}</span>
          <a href="${data.download_url}"
             class="inline-block mt-2 px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded shadow transition">
            ⬇️ Download Your Reel
          </a>`;
      }
    } catch (err) {
      console.error("Error polling progress:", err);
      msg.innerHTML = `<span class="text-red-600">⚠️ Connection lost. Please refresh or try again later.</span>`;
    }
  }

  pollProgress();
</script>
{% endblock %}

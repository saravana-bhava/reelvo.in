<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reel History</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background: #f9f9f9;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 18px;
      text-transform: capitalize;
    }
    .card p {
      margin: 4px 0;
      color: #555;
      font-size: 14px;
    }
    .actions a {
      display: inline-block;
      margin-right: 10px;
      margin-top: 10px;
      padding: 6px 12px;
      font-size: 14px;
      text-decoration: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
    }
    .actions a.secondary {
      background: #28a745;
    }
  </style>
</head>
<body>

  <h1>📽️ Reel History</h1>
  <div id="reel-history" class="grid">
    <!-- Cards will be inserted here -->
  </div>

  <script>
    async function fetchReels() {
      try {
        const response = await fetch("/api/reels");
        const reels = await response.json();

        const container = document.getElementById("reel-history");
        if (!reels.length) {
          container.innerHTML = "<p>No reels found.</p>";
          return;
        }

        reels.forEach(reel => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <h2>${reel.category}</h2>
            <p><strong>Language:</strong> ${reel.language.toUpperCase()}</p>
            <p><strong>Duration:</strong> ${reel.duration}</p>
            <p><strong>Created:</strong> ${new Date(reel.created_at).toLocaleDateString()}</p>
            <div class="actions">
              ${reel.drive_url ? `<a href="${reel.drive_url}" target="_blank">📥 Drive</a>` : ""}
              ${reel.instagram_url ? `<a href="${reel.instagram_url}" target="_blank" class="secondary">📸 Instagram</a>` : ""}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error("Failed to fetch reel history", err);
      }
    }

    fetchReels();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reel History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f5f5f5;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 20px;
    }

    .nav {
      text-align: center;
      margin-bottom: 20px;
    }

    .nav a {
      display: inline-block;
      margin: 0 12px;
      padding: 6px 12px;
      text-decoration: none;
      color: #333;
      border: 1px solid #aaa;
      border-radius: 4px;
      background-color: #fff;
      transition: background-color 0.2s ease;
    }

    .nav a:hover {
      background-color: #eee;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    video {
      width: 100%;
      height: auto;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 80px;
      font-size: 14px;
      padding: 6px;
      margin-bottom: 10px;
      resize: vertical;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    select, button {
      padding: 6px 10px;
      font-size: 14px;
    }

    .label {
      font-weight: bold;
      margin-bottom: 4px;
      display: block;
    }

    .script-label {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🎞️ {{ user | capitalize }}'s Reel History</h1>

  <div class="nav">
    <a href="{{ url_for('dashboard') }}">⬅️ Back to Dashboard</a>
    <a href="{{ url_for('logout') }}">🔓 Logout</a>
  </div>

  {% if videos %}
    <div class="video-grid">
      {% for video in videos %}
        <div class="video-card">
          <video controls>
            <source src="{{ url_for('serve_video', username=user, filename=video) }}" type="video/mp4">
            Your browser does not support the video tag.
          </video>

          <label class="label script-label">🎤 Script</label>
          <textarea name="script">{{ scripts.get(video, "No script found.") }}</textarea>

          <div class="controls">
            <div>
              <label class="label">Voice Provider:</label>
              <select name="voice_provider">
                <option value="google">Google TTS</option>
                <option value="elevenlabs">ElevenLabs</option>
              </select>
            </div>
            <div>
              <label class="label">Voice Gender:</label>
              <select name="voice_gender">
                <option value="female">Female</option>
                <option value="male">Male</option>
              </select>
            </div>
            <button onclick="alert('🚧 Re-generation not yet wired up')">🔁 Regenerate Reel</button>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p style="text-align:center;">No reels generated yet.</p>
  {% endif %}

</body>
</html>

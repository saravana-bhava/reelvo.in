{% extends "base.html" %}
{% block title %}Scheduled Reels | Reelvo.ai{% endblock %}

{% block content %}
<h2 style="margin-bottom: 20px;">📅 Scheduled Reels for <span style="color:#007BFF;">{{ user }}</span></h2>

{% if schedule %}
  {% for item in schedule %}
    <div style="margin-bottom: 30px; padding: 20px; background: #ffffff; border: 1px solid #dee2e6; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);">
      <video width="300" height="534" controls style="border-radius: 8px;">
        <source src="{{ url_for('serve_video', username=user, filename=item.video) }}" type="video/mp4">
        Your browser does not support the video tag.
      </video>

      <!-- Edit Schedule Form -->
      <form method="POST" action="{{ url_for('edit_schedule', index=loop.index0) }}" style="margin-top: 15px;">
        <div style="margin-bottom: 12px;">
          <label for="scheduled_for_{{ loop.index0 }}"><strong>📅 Scheduled Date:</strong></label><br>
          <input type="date" id="scheduled_for_{{ loop.index0 }}" name="scheduled_for"
                 value="{{ item.scheduled_for }}"
                 required
                 style="padding: 8px; width: 100%; max-width: 300px; border: 1px solid #ccc; border-radius: 5px;" />
        </div>

        <div style="margin-bottom: 12px;">
          <label for="caption_{{ loop.index0 }}"><strong>✏️ Caption:</strong></label><br>
          <textarea id="caption_{{ loop.index0 }}" name="caption" rows="3"
                    style="width: 100%; max-width: 500px; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">{{ scripts[item.video] or '' }}</textarea>
        </div>

        <button type="submit"
                style="padding: 8px 14px; background-color: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer;">
          💾 Save
        </button>
      </form>

      <!-- Delete Schedule Form -->
      <form method="POST" action="{{ url_for('delete_schedule', index=loop.index0) }}" style="margin-top: 10px;">
        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this scheduled reel?')"
                style="padding: 8px 14px; background-color: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer;">
          🗑️ Delete
        </button>
      </form>
    </div>
  {% endfor %}
{% else %}
  <p style="font-size: 16px; color: #555;">⚠️ No scheduled reels found.</p>
{% endif %}

<p style="margin-top: 40px;">
  <a class="button" href="{{ url_for('dashboard') }}" style="text-decoration: none; padding: 10px 16px; background: #007bff; color: #fff; border-radius: 6px;">⬅️ Back to Dashboard</a>
</p>
{% endblock %}

{% extends "base.html" %}
{% block title %}Forgot Password - Reelvo.ai{% endblock %}

{% block content %}
<h2 class="page-heading">🔑 Forgot Your Password?</h2>

<form method="post"
      action="{{ url_for('auth.forgot_password') }}"
      class="form-card"
      aria-label="Forgot Password Form">

  <label for="email" class="form-label">
    📧 Your Email
  </label>
  <input type="email"
         id="email"
         name="email"
         placeholder="Enter your registered email..."
         required
         autocomplete="email"
         class="form-input" />

  <button type="submit" class="button button-primary" style="width: 100%;">
    🔄 Send Reset Link
  </button>

  <div class="form-footer">
    <a href="{{ url_for('auth.login') }}"
       class="button"
       role="button"
       aria-label="Back to Login">
      ⬅️ Back to Login
    </a>
  </div>
</form>
{% endblock %}

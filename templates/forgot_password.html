{% extends "base.html" %}
{% block title %}Forgot Password - Reelvo.ai{% endblock %}

{% block content %}
  <h2 style="text-align: center; margin-top: 40px;">🔑 Forgot Your Password?</h2>

  <form method="post"
        action="{{ url_for('auth.forgot_password') }}"
        style="max-width: 400px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);"
        aria-label="Forgot Password Form">

    <label for="email"
           style="display: block; margin-bottom: 8px; font-weight: bold;">
      📧 Your Email
    </label>
    <input type="email"
           id="email"
           name="email"
           placeholder="Enter your registered email..."
           required
           autocomplete="email"
           style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 20px;" />

    <button type="submit"
            style="width: 100%; padding: 12px; background-color: #007BFF; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer;">
      🔄 Send Reset Link
    </button>

    <div style="margin-top: 20px; text-align: center;">
      <a href="{{ url_for('auth.login') }}" class="button">⬅️ Back to Login</a>
    </div>
  </form>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-bold mb-4">{{ action }} User</h2>
<form method="POST" class="space-y-4">
  <div>
    <label>Email</label>
    <input type="email" name="email" value="{{ user.email if user else '' }}" required class="border p-2 w-full">
  </div>
  <div>
    <label>Password</label>
    <input type="password" name="password" class="border p-2 w-full">
  </div>
  <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">{{ action }}</button>
  <a href="{{ url_for('admin.users_list') }}" class="ml-2 text-gray-600">Cancel</a>
</form>
{% endblock %}

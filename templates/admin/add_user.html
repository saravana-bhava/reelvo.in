{% extends "base.html" %}
{% block title %}Add User | Reelvo{% endblock %}

{% block heading %}
<div class="flex">
  <span class="inline-flex items-center gap-2 text-2xl font-bold text-gray-900 dark:text-gray-600">
    ➕ Add User
  </span>
</div>
{% endblock %}

{% block content %}
<div class="p-8 bg-white shadow-lg rounded-2xl border border-gray-200 mt-6">
    <h1 class="text-xl font-bold mb-4">Add User</h1>
    <form method="post" class="space-y-4">
      <div>
        <label class="block">Email</label>
        <input type="email" name="email" class="border p-2 w-full" required>
      </div>
      <div>
        <label class="block">Password</label>
        <input type="password" name="password" class="border p-2 w-full" required>
      </div>
      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Save</button>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Create Reel{% endblock %}

{% block content %}
<h2>🎬 Create Your AI Reel ({{ user }})</h2>

<form id="reelForm" method="post" action="{{ url_for('create_reel_action') }}" enctype="multipart/form-data">
  <!-- Theme/topic selection -->
  <label for="theme">Select Theme:</label>
  <select name="theme" id="theme">
    <option value="">-- Choose theme --</option>
    <option>motivation</option>
    <option>gym</option>
    <option>life</option>
    <option>success</option>
  </select>

  <label for="custom_topic">Or Custom Topic/Product:</label>
  <input name="custom_topic" id="custom_topic" placeholder="e.g. Protein Powder" />

  <!-- Language selection -->
  <label for="language">Language:</label>
  <select name="language" id="language" required>
    <option value="en">🇺🇸 English</option>
    <option value="hi">🇮🇳 Hindi</option>
  </select>

  <!-- Script generation -->
  <button type="button" onclick="generateScript()">📝 Generate Script</button>

  <label for="script">Edit Script:</label>
  <textarea name="script" id="script" rows="5" required>{{ script or '' }}</textarea>

  <!-- Voice selection -->
  <label for="voice_option">Voiceover Option:</label>
  <select name="voice_option" id="voice_option">
    <option value="tts">Use AI Voice (TTS)</option>
    <option value="upload">Upload my voice</option>
  </select>

  <label for="voice_artist">TTS Voice:</label>
  <select name="voice_artist" id="voice_artist">
    <option value="en_male_energetic">English Male (Energetic)</option>
    <option value="en_female_neutral">English Female (Neutral)</option>
    <option value="hi_male_deep">Hindi Male (Deep)</option>
    <option value="hi_female_friendly">Hindi Female (Friendly)</option>
  </select>

  <label for="custom_voice">Upload Voiceover:</label>
  <input type="file" name="custom_voice" id="custom_voice" accept=".mp3,.wav" />

  <!-- Options -->
  <label><input type="checkbox" name="subtitles" checked /> Include Subtitles</label><br>
  <label><input type="checkbox" name="watermark" checked /> Include Watermark</label><br>

  <button type="submit">📦 Create Reel</button>
</form>

<!-- Script AJAX handler -->
<script>
  async function generateScript() {
    const theme = document.getElementById('theme').value.trim();
    const topic = document.getElementById('custom_topic').value.trim();
    const lang = document.getElementById('language').value;

    const res = await fetch('{{ url_for("generate_script_ajax") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ theme, custom_topic: topic, language: lang })
    });

    const data = await res.json();
    document.getElementById('script').value = data.script || data.error || 'Error generating script.';
  }
</script>

<!-- Previous reels -->
<h3>Your Previous Reels</h3>
<ul>
  {% for v in videos %}
    <li><a href="{{ url_for('serve_video', username=user, filename=v) }}">{{ v }}</a></li>
  {% else %}
    <li>No reels found.</li>
  {% endfor %}
</ul>
{% endblock %}

<!-- File: templates/create_reel.html -->
{% extends "base.html" %}

{% block title %}Create Reel - Reelvo.ai{% endblock %}

{% block content %}
<h2>🎬 Create a New Reel</h2>

<form method="POST" action="{{ url_for('create_reel_action') }}" enctype="multipart/form-data">
  <label for="theme">Choose a Theme:</label>
  <select name="theme" id="theme">
    <option value="">-- Select --</option>
    <option value="motivation">Motivation</option>
    <option value="success">Success</option>
    <option value="life">Life</option>
    <option value="inspiration">Inspiration</option>
    <option value="sad">Sad</option>
  </select>

  <label for="custom_topic">Or Enter Custom Topic:</label>
  <input type="text" name="custom_topic" id="custom_topic" placeholder="e.g., Overcoming fear" />

  <label for="language">Language:</label>
  <select name="language" id="language" required>
    <option value="en">English</option>
    <option value="hi">Hindi</option>
  </select>

  <button type="button" onclick="generateScript()">🧠 Generate Script</button>

  <label for="script">Script:</label>
  <textarea name="script" id="script" rows="6" required>{{ script or '' }}</textarea>

  <fieldset>
    <legend>Voice Option:</legend>
    <label><input type="radio" name="voice_option" value="tts" checked /> Use AI Voice (TTS)</label><br/>
    <label><input type="radio" name="voice_option" value="upload" /> Upload your own voice file</label><br/>
    <input type="file" name="custom_voice" accept="audio/*" />
  </fieldset>

  <label for="voice_artist">Voice Artist (TTS only):</label>
  <select name="voice_artist" id="voice_artist">
    <option value="en_male_energetic">Male Energetic (EN)</option>
    <option value="en_female_smooth">Female Smooth (EN)</option>
    <option value="hi_male_natural">Male Natural (HI)</option>
    <option value="hi_female_confident">Female Confident (HI)</option>
  </select>

  <label><input type="checkbox" name="subtitles" checked /> Include Subtitles</label><br/>
  <label><input type="checkbox" name="watermark" checked /> Add Watermark</label><br/>

  <button type="submit">🚀 Create Reel</button>
</form>

<script>
  async function generateScript() {
    const theme = document.getElementById("theme").value;
    const topic = document.getElementById("custom_topic").value;
    const language = document.getElementById("language").value;

    try {
      const res = await fetch("{{ url_for('generate_script_ajax') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ theme, custom_topic: topic, language })
      });

      const data = await res.json();
      if (data.script) {
        document.getElementById("script").value = data.script;
      } else {
        alert("❌ " + (data.error || "Script generation failed."));
      }
    } catch (err) {
      alert("❌ Failed to generate script. Please try again.");
      console.error(err);
    }
  }
</script>
{% endblock %}

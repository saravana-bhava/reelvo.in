{% extends "base.html" %}
{% block title %}Create Reel{% endblock %}

{% block content %}
<h2>🎬 Create Your AI Reel ({{ user }})</h2>

<form id="reelForm" method="post" action="{{ url_for('reels.create_reel_action') }}" enctype="multipart/form-data">
  <label for="theme"><strong>🎯 Select Theme:</strong></label>
  <select id="theme" name="theme" onchange="checkPromptFilled()">
    <option value="">-- Choose theme --</option>
    {% for t in themes %}
      <option value="{{ t }}">{{ t|capitalize }}</option>
    {% endfor %}
  </select>

  <label for="custom_topic"><strong>💡 Or Custom Topic/Product:</strong></label>
  <input type="text" id="custom_topic" name="custom_topic" placeholder="e.g. Protein Powder" oninput="checkPromptFilled()" />

  <label for="language"><strong>🌐 Language:</strong></label>
  <select id="language" name="language" required>
    <option value="en">🇺🇸 English</option>
    <option value="hi">🇮🇳 Hindi</option>
  </select>

  <button type="button" id="generateBtn" onclick="generateScript()" disabled>📝 Generate Script</button>
  <div id="script-status" style="margin-top: 8px; color: #555;"></div>

  <label for="script"><strong>✏️ Edit Script:</strong></label>
  <textarea id="script" name="script" rows="6" required>{{ script }}</textarea>

  <label for="voice_option"><strong>🎙️ Voiceover Option:</strong></label>
  <select id="voice_option" name="voice_option">
    <option value="tts">Use AI Voice (TTS)</option>
    <option value="upload">Upload My Voice</option>
  </select>

  <label for="voice_artist"><strong>🔊 TTS Voice:</strong></label>
  <select id="voice_artist" name="voice_artist">
    <optgroup label="English">
        <option value="en-US-Wavenet-A">English Male (Calm)</option>
        <option value="en-US-Wavenet-B">English Male (Deep)</option>
        <option value="en-US-Wavenet-C">English Female (Warm)</option>
        <option value="en-US-Wavenet-D">English Male (Energetic)</option>
        <option value="en-US-Wavenet-E">English Female (Upbeat)</option>
        <option value="en-US-Wavenet-F">English Female (Neutral)</option>
    </optgroup>
    <optgroup label="Hindi">
        <option value="hi-IN-Wavenet-A">Hindi Male (Deep)</option>
        <option value="hi-IN-Wavenet-B">Hindi Male (Warm)</option>
        <option value="hi-IN-Wavenet-C">Hindi Female (Friendly)</option>
        <option value="hi-IN-Wavenet-D">Hindi Female (Polite)</option>
    </optgroup>
</select>

  <label for="custom_voice"><strong>📁 Upload Voiceover:</strong></label>
  <input type="file" id="custom_voice" name="custom_voice" accept=".mp3,.wav" />

  <label><input type="checkbox" name="subtitles" checked /> Include Subtitles</label><br>
  <label><input type="checkbox" name="watermark" checked /> Include Watermark</label><br><br>

  <button type="submit">📦 Create Reel</button>
</form>

<script>
const generateBtn = document.getElementById('generateBtn');
const themeInput = document.getElementById('theme');
const topicInput = document.getElementById('custom_topic');
const scriptTextarea = document.getElementById('script');
const statusDiv = document.getElementById('script-status');

function checkPromptFilled() {
  const theme = themeInput.value.trim();
  const topic = topicInput.value.trim();
  generateBtn.disabled = !(theme || topic);
}

// Attach listeners
themeInput.addEventListener('change', checkPromptFilled);
topicInput.addEventListener('input', checkPromptFilled);

async function generateScript() {
  const theme = themeInput.value.trim();
  const topic = topicInput.value.trim();
  const lang = document.getElementById('language').value;

  if (!theme && !topic) {
    statusDiv.textContent = '❌ Please enter a theme or topic.';
    return;
  }

  // Disable button immediately
  generateBtn.disabled = true;
  generateBtn.textContent = '⏳ Generating...';
  statusDiv.textContent = '⏳ Generating script...';

  try {
    const res = await fetch('{{ url_for("reels.generate_script_ajax") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ theme, custom_topic: topic, language: lang })
    });

    const data = await res.json();

    if (data.script) {
      scriptTextarea.value = data.script;
      statusDiv.textContent = '✅ Script generated.';
    } else {
      statusDiv.textContent = data.error || '❌ Generation failed.';
    }
  } catch (err) {
    statusDiv.textContent = '❌ Request failed. Try again.';
  } finally {
    // Re-enable the button in all cases
    generateBtn.disabled = false;
    generateBtn.textContent = '📝 Generate Script';
  }
}
</script>

<hr />

<h3>🎞️ Your Previous Reels</h3>
<ul>
  {% for v in videos %}
  <li><a href="{{ url_for('reels.serve_video', username=user, filename=v) }}" target="_blank" rel="noopener">{{ v }}</a></li>
  {% else %}
  <li>No reels found.</li>
  {% endfor %}
</ul>
{% endblock %}

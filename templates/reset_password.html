{% extends "base.html" %}
{% block title %}Reset Password - Reelvo{% endblock %}

{% block content %}
  <h2 class="page-heading">🔐 Reset Your Password</h2>

  <form method="post"
        action="{{ request.url }}"
        class="form-card"
        aria-label="Reset Password Form">

    <p style="margin-bottom: 20px; font-size: 15px; text-align: center;">
      Resetting password for <strong>{{ email }}</strong>
    </p>

    <!-- New Password Field -->
    <label for="password" class="form-label">
      🔑 New Password
    </label>
    <input type="password"
           id="password"
           name="password"
           placeholder="Enter new password..."
           required
           minlength="8"
           autocomplete="new-password"
           aria-describedby="passwordHelp"
           class="form-input" />

    <small id="passwordHelp" style="display:block; margin-bottom:15px; color:#6c757d;">
      Your password should be at least 8 characters.
    </small>

    <!-- Submit Button -->
    <button type="submit" class="button button-success" style="width: 100%;">
      ✅ Update Password
    </button>

    <!-- Footer Link -->
    <div class="form-footer">
      <a href="{{ url_for('auth.login') }}" class="link-primary" role="button" aria-label="Back to Login">
        ⬅️ Back to Login
      </a>
    </div>
  </form>
{% endblock %}

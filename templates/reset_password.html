{% extends "base.html" %}
{% block title %}Reset Password - Reelvo{% endblock %}

{% block content %}
<h2 class="page-heading">🔐 Reset Your Password</h2>

<form method="post"
      action="{{ request.url }}"
      class="form-card"
      aria-label="Reset Password Form">

  <p class="form-subtext" style="margin-bottom: 20px; text-align: center;">
    Resetting password for <strong>{{ email }}</strong>
  </p>

  <!-- New Password -->
  <label for="password" class="form-label">
    🔑 New Password
  </label>
  <input type="password"
         id="password"
         name="password"
         placeholder="Enter a new password..."
         required
         minlength="8"
         autocomplete="new-password"
         aria-describedby="passwordHelp"
         class="form-input" />

  <div id="passwordHelp" class="form-help" style="margin-bottom: 15px;">
    Your password must be at least 8 characters long.
  </div>

  <!-- Submit -->
  <button type="submit" class="button button-success" style="width: 100%;">
    ✅ Update Password
  </button>

  <div class="form-footer">
    <a href="{{ url_for('auth.login') }}"
       class="link-primary"
       role="button"
       aria-label="Back to Login">
      ⬅️ Back to Login
    </a>
  </div>
</form>
{% endblock %}

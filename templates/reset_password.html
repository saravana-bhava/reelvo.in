{% extends "base.html" %}
{% block title %}Reset Password - Reelvo{% endblock %}
{% block heading %}🔐 Reset Your Password{% endblock %}

{% block content %}
<section role="region" aria-labelledby="reset-password-heading" class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-lg shadow p-8 animate__animated animate__fadeInUp">
  <p class="text-center text-gray-700 dark:text-gray-300 text-sm mb-6">
    Resetting password for <strong>{{ email }}</strong>
  </p>

  <form method="post"
        action="{{ request.url }}"
        aria-label="Reset Password Form"
        class="space-y-6">

    <!-- New Password -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        🔑 New Password
      </label>
      <input type="password"
             id="password"
             name="password"
             required
             minlength="8"
             autocomplete="new-password"
             placeholder="Enter a new password..."
             class="w-full px-4 py-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
             aria-describedby="passwordHelp"
             aria-required="true" />
      <p id="passwordHelp" class="text-xs text-gray-500 dark:text-gray-400 mt-1">
        Your password must be at least 8 characters long.
      </p>
    </div>

    <!-- Submit Button -->
    <button type="submit"
            class="w-full bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded shadow transition"
            aria-label="Update Password">
      ✅ Update Password
    </button>

    <!-- Back to Login -->
    <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-6">
      <a href="{{ url_for('auth.login') }}" class="text-blue-600 dark:text-blue-400 hover:underline" role="button">
        ⬅️ Back to Login
      </a>
    </p>
  </form>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Reset Password - Reelvo.ai{% endblock %}

{% block content %}
  <h2 style="text-align: center; margin-top: 40px;">🔐 Reset Your Password</h2>

  <form method="post"
        action="{{ request.url }}"
        style="max-width: 400px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);"
        aria-label="Reset Password Form">

    <p style="margin-bottom: 20px; font-size: 15px; text-align: center;">
      Resetting password for <strong>{{ email }}</strong>
    </p>

    <label for="password"
           style="display: block; margin-bottom: 8px; font-weight: bold;">
      🔑 New Password
    </label>
    <input type="password"
           id="password"
           name="password"
           placeholder="Enter new password..."
           required
           autocomplete="new-password"
           aria-describedby="passwordHelp"
           style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 20px;" />
    <small id="passwordHelp" style="display:block; margin-bottom:15px; color:#6c757d;">
      Your password should be at least 8 characters.
    </small>

    <button type="submit"
            style="width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer;">
      ✅ Update Password
    </button>

    <div style="margin-top: 20px; text-align: center;">
      <a href="{{ url_for('auth.login') }}" class="button" role="button" aria-label="Back to Login">⬅️ Back to Login</a>
    </div>
  </form>
{% endblock %}

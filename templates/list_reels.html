{% extends "base.html" %}
{% block title %}Reel History{% endblock %}
{% block content %}
<h2>📂 Reel History ({{ user }})</h2>
{% for vid in videos %}
  <div style="margin-bottom:20px;">
    <video width="320" height="568" controls src="{{ url_for('serve_video', username=user, filename=vid) }}"></video><br/>
    <strong>{{ vid }}</strong>
    <pre style="background:#f0f0f0; padding:10px;">{{ scripts[vid] }}</pre>
  </div>
{% else %}
  <p>No videos found yet.</p>
{% endfor %}
{% endblock %}

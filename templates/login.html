{% extends "base.html" %}
{% block title %}Login - Reelvo.ai{% endblock %}

{% block content %}
  <h2 style="text-align:center;">🔐 Login to Reelvo.ai</h2>

  <form method="post" action="{{ url_for('login') }}" style="max-width: 400px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.1);">
    <label for="username">👤 Your Name:</label>
    <input type="text" id="username" name="username" placeholder="Enter your name..." required />

    <button type="submit" style="width: 100%;">🚀 Login</button>
  </form>
{% endblock %}

{% extends "base.html" %}
{% block title %}Login - Reelvo.ai{% endblock %}

{% block content %}
  <h2 style="text-align: center; margin-top: 40px;">🔐 Login to Reelvo.ai</h2>

  <form method="post"
        action="{{ url_for('auth.login') }}"
        style="max-width: 400px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);"
        aria-label="Login Form">

    <label for="user_name"
           style="display: block; margin-bottom: 8px; font-weight: bold;">
      👤 Your Name
    </label>
    <input type="text"
           id="user_name"
           name="user_name"
           placeholder="Enter your name..."
           required
           autocomplete="username"
           style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 20px;" />

    <label for="password"
           style="display: block; margin-bottom: 8px; font-weight: bold;">
      🔑 Password
    </label>
    <input type="password"
           id="password"
           name="password"
           placeholder="Enter your password..."
           required
           autocomplete="current-password"
           style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 20px;" />

    <button type="submit"
            style="width: 100%; padding: 12px; background-color: #007BFF; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer;">
      🚀 Login
    </button>
  </form>
{% endblock %}

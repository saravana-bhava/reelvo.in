{% extends "base.html" %}
{% block title %}Login - Reelvo{% endblock %}

{% block heading %}
<span class="inline-flex items-center gap-2 text-2xl font-bold text-gray-900 dark:text-gray-600">
  🔐 Login to Reelvo
</span>
{% endblock %}

{% block content %}
<section role="region"
         aria-labelledby="login-heading"
         class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-xl shadow p-8 animate-fade-in space-y-8">

  <!-- Google Login -->
  <div class="animate__animated animate__fadeIn" style="display:none">
    {% include 'includes/google_login_button.html' %}
  </div>

  <!-- Divider -->
  <div class="text-center text-gray-500 dark:text-gray-400 text-sm" style="display:none">OR</div>

  <!-- Standard Login Form -->
  <form method="post"
        action="{{ url_for('auth.login') }}"
        aria-label="Password Login Form"
        class="space-y-6">

    <!-- Email -->
    <div>
      <label for="email" class="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1">
        📧 Email Address
      </label>
      <input type="email"
             id="email"
             name="email"
             required
             autocomplete="email"
             placeholder="you@example.com"
             class="w-full px-4 py-2 rounded-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
             aria-required="true" />
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1">
        🔑 Password
      </label>
      <input type="password"
             id="password"
             name="password"
             required
             autocomplete="current-password"
             placeholder="••••••••"
             class="w-full px-4 py-2 rounded-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
             aria-required="true" />
    </div>

    <!-- Forgot Password -->
    <div class="text-right">
      <a href="{{ url_for('auth.forgot_password') }}"
         class="text-sm text-blue-600 dark:text-blue-400 hover:underline"
         role="button">
        ❓ Forgot Password?
      </a>
    </div>

    <!-- Submit Button -->
    <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md shadow transition focus:outline-none focus:ring-2 focus:ring-blue-500"
            aria-label="Login to your account">
      🚀 Login
    </button>
  </form>

  <!-- Divider -->
  <div class="text-center text-gray-500 dark:text-gray-400 text-sm" style="display:none">OR</div>

  <!-- OTP Login Form -->
  <form method="post"
        action="{{ url_for('auth.request_otp') }}"
        aria-label="OTP Login Form"
        class="space-y-4" style="display:none">

    <div>
      <label for="otp-email" class="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1">
        📧 Email for OTP Login
      </label>
      <input type="email"
             id="otp-email"
             name="email"
             required
             autocomplete="email"
             placeholder="you@example.com"
             class="w-full px-4 py-2 rounded-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
             aria-required="true" />
    </div>

    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-md shadow transition focus:outline-none focus:ring-2 focus:ring-indigo-500"
            aria-label="Send OTP to Email">
      ✉️ Send OTP to Email
    </button>
  </form>

  <!-- Register Link -->
  <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-6">
    Don’t have an account?
    <a href="{{ url_for('auth.register') }}" class="text-blue-600 dark:text-blue-400 hover:underline">
      Register here
    </a>
  </p>
</section>

<!-- Fade Animation -->
<style>
@keyframes fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
  animation: fade-in 0.4s ease-out;
}
</style>
{% endblock %}

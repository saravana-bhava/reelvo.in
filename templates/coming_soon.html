{% extends "base.html" %}
{% block title %}Coming Soon{% endblock %}

{% block content %}
<div class="coming-soon-box" role="region" aria-label="Feature Under Development">
  <h2>🚧 Coming Soon</h2>
  <p class="feature-message">
    {{ feature_name }} is under development.
  </p>

  <div class="blurred-section" aria-hidden="true">
    <p>This feature will be available in a future update.</p>
  </div>

  <a href="{{ url_for('dashboard.dashboard') }}" class="button back-to-dashboard">
    ⬅️ Back to Dashboard
  </a>
</div>
{% endblock %}
